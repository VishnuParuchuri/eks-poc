name: Terraform DevSecOps EKS Pipeline

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-1
  TF_WORKING_DIR: terraform

jobs:

################################
# 1️⃣ Terraform Format
################################

  terraform-fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -diff > fmt-report.txt || true

      - name: Upload FMT Report
        uses: actions/upload-artifact@v4
        with:
          name: terraform-fmt-report
          path: terraform/fmt-report.txt

################################
# 2️⃣ Terraform Validate
################################

  terraform-validate:
    needs: terraform-fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform validate > validate-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: terraform-validate-report
          path: terraform/validate-report.txt

################################
# 3️⃣ tfsec
################################

  tfsec:
    needs: terraform-validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          additional_args: --format json --out tfsec-report.json

      - uses: actions/upload-artifact@v4
        with:
          name: tfsec-report
          path: terraform/tfsec-report.json

################################
# 4️⃣ Checkov
################################

  checkov:
    needs: tfsec
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          output_format: json
          output_file_path: checkov-report.json
          soft_fail: true

      - uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov-report.json

################################
# 5️⃣ Trivy
################################

  trivy:
    needs: checkov
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-report.json

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

################################
# 6️⃣ Terraform Plan
################################

  terraform-plan:
    needs: trivy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform plan -out=tfplan > plan-output.txt

      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-binary
          path: terraform/tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-report
          path: terraform/plan-output.txt

################################
# 7️⃣ Terraform Apply (Manual Approval)
################################

  terraform-apply:
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
      - run: terraform init

      - uses: actions/download-artifact@v4
        with:
          name: terraform-plan-binary
          path: terraform

      - run: terraform apply -auto-approve tfplan

      - name: Capture Terraform Output
        run: terraform output -json > output.json

      - uses: actions/upload-artifact@v4
        with:
          name: terraform-output
          path: terraform/output.json

      - name: Show ELB DNS
        run: terraform output nginx_external_dns