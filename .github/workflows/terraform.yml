name: Terraform DevSecOps EKS Pipeline

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-1
  TF_WORKING_DIR: terraform

jobs:

# ==========================================
# 1️⃣ Terraform Format
# ==========================================
  terraform-fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Format Check
        run: terraform fmt -check

# ==========================================
# 2️⃣ Terraform Init
# ==========================================
    terraform-init:
    needs: terraform-fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Upload Terraform Init Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terraform-init-artifacts
          path: terraform/.terraform

# ==========================================
# 3️⃣ Terraform Validate
# ==========================================
  terraform-validate:
    needs: terraform-init
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Terraform Init Artifacts
        uses: actions/download-artifact@v4
        with:
          name: terraform-init-artifacts
          path: terraform/.terraform

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Validate
        run: terraform validate

# ==========================================
# 4️⃣ tfsec Scan
# ==========================================
  tfsec-scan:
    needs: terraform-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform

# ==========================================
# 5️⃣ Checkov Scan (Soft Fail)
# ==========================================
  checkov-scan:
    needs: tfsec-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          output_format: cli
          soft_fail: true

# ==========================================
# 6️⃣ Trivy Scan
# ==========================================
  trivy-scan:
    needs: checkov-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .

# ==========================================
# 7️⃣ Terraform Plan
# ==========================================
  terraform-plan:
    needs: trivy-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init
      - run: terraform plan -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan

# ==========================================
# 8️⃣ Terraform Apply (Manual Approval)
# ==========================================
  terraform-apply:
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      # 🔥 PRINT ELB DNS IN LOGS
      - name: Show ELB DNS in Logs
        run: |
          echo "=============================="
          echo "Application ELB DNS:"
          terraform output nginx_external_dns
          echo "=============================="

      # 🔥 ADD TO GITHUB ACTIONS SUMMARY
      - name: Add ELB to Job Summary
        run: |
          echo "## 🚀 Application ELB DNS" >> $GITHUB_STEP_SUMMARY
          echo "\`$(terraform output -raw nginx_external_dns)\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Open in browser: http://$(terraform output -raw nginx_external_dns)" >> $GITHUB_STEP_SUMMARY

      # 🔥 SAVE AS ARTIFACT
      - name: Save ELB Output to File
        run: terraform output -raw nginx_external_dns > elb.txt

      - name: Upload ELB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elb-dns-output
          path: terraform/elb.txt